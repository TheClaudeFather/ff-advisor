name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        # The package itself has no required dependencies: requests is optional
        # and curl is the fallback, so nothing else is installed here.
        run: python -m pip install --upgrade pip pytest
      - name: Run the suite
        # SLEEPER_HOME points at an empty directory so the run cannot read a
        # cache that only exists on a developer machine. The autouse guard in
        # tests/conftest.py already turns any network call into a failure.
        env:
          SLEEPER_HOME: ${{ runner.temp }}/sleeper-home
        run: python -m pytest -q
